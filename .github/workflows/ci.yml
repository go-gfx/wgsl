name: ci
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: { contents: read }

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  lint:
    name: gofmt and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.4' }
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "::error::not gofmt-ed:"; echo "$out"; exit 1; fi
      - run: go vet ./...

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.4' }
      - run: go test ./...

  # spirv-val, the Khronos validator, is the oracle for package spirv: this job
  # installs SPIRV-Tools from the distribution and runs the spirv tests with the
  # validator required (without SPIRV_VAL=required they skip it). Nothing else
  # depends on it; no build or run does.
  spirv-val:
    name: spirv-val
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.4' }
      - name: install SPIRV-Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y spirv-tools
          spirv-val --version
      - name: validate the emitted modules
        env:
          SPIRV_VAL: required
        run: go test -count=1 -v ./spirv/

  # The edge cases of docs/MSL.md as compute dispatches of the emitted SPIR-V on
  # lavapipe, through go-gfx/vulkan, in a nested module so that the core does
  # not depend on it. lavapipe and the validation layer are oracles only.
  # VULKAN_REQUIRE=1 makes a missing loader a failure; the validation layer is on
  # and ANY message it prints fails the job.
  vulkan:
    name: lavapipe (spirv/vulkantest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.4' }
      - name: install lavapipe and the validation layer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers vulkan-validationlayers vulkan-tools libvulkan1
          vulkaninfo --summary
      - name: run the edge cases
        working-directory: spirv/vulkantest
        env:
          CGO_ENABLED: "0"
          VULKAN_REQUIRE: "1"
          VULKAN_VALIDATION: "1"
        run: |
          go test -count=1 -v ./... 2>&1 | tee out.txt
          if grep -q -E 'Validation (Error|Warning)|VUID-' out.txt; then echo "::error::the validation layer reported"; exit 1; fi

  # The edge cases of docs/HLSL.md as compute dispatches of the emitted HLSL on
  # Direct3D 11 WARP (the software rasterizer of Windows), through
  # go-mswin/d3d11, in a nested module so that the core does not depend on it.
  # Every emitted file is compiled by D3DCompile (cs_5_0, IEEE strictness,
  # warnings as errors). No GPU is involved; WARP and d3dcompiler are oracles
  # only.
  d3d11:
    name: WARP (hlsl/hlsltest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.4' }
      - name: vet
        working-directory: hlsl/hlsltest
        run: go vet ./...
      - name: run the edge cases
        working-directory: hlsl/hlsltest
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 -v ./...

  test-386:
    name: test (linux/386)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.4' }
      - run: GOARCH=386 go test -count=1 ./...

  fuzz:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.4' }
      - run: go test -run '^$' -fuzz FuzzParse -fuzztime 20s .
      - run: go test -run '^$' -fuzz FuzzRoundTrip -fuzztime 20s .
      - run: go test -run '^$' -fuzz FuzzValidate -fuzztime 20s .

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.4' }
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
